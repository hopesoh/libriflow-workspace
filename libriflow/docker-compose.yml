version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: libriflow-db
    restart: always
    environment:
      POSTGRES_USER: libriflow_user
      POSTGRES_PASSWORD: libriflow_pass
      POSTGRES_DB: libriflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
