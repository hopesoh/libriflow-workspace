server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: monolith-route
          uri: http://localhost:8080
          predicates:
            - Path=/**

        - id: book-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/books/**